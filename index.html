<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Basia's website</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --neon-green: #39ff14;
      --neon-yellow: #ffff33;
      --dark-bg: #111111;
      --accent-pink: #ff00ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--neon-green);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #000;
      overflow-x: hidden;
    }

    /* Top music bar */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.9);
      color: var(--neon-yellow);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.5rem 1rem;
      z-index: 100;
    }

    header h1 {
      font-size: 1rem;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .music-controls {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .music-button {
      background: var(--accent-pink);
      color: #000;
      border: none;
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .music-button:hover {
      filter: brightness(1.2);
    }

    .track-name {
      font-size: 0.8rem;
      opacity: 0.8;
    }

    /* Layout */
    .page-wrapper {
      min-height: 100vh;
      padding-top: 3rem;
      padding-bottom: 4rem;
      display: flex;
      flex-direction: row;
      align-items: stretch;
    }

    main {
      flex: 1;
      padding: 2rem 1.5rem;
      max-width: 900px;
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    button,
    .link-button {
      cursor: pointer;
      border-radius: 999px;
      border: 2px solid #000;
      padding: 0.8rem 1rem;
      font-size: 0.95rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: var(--dark-bg);
      color: #fff;
      transition: transform 0.1s ease, filter 0.1s ease;
    }

    button:hover,
    .link-button:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    /* Cucumber button */
    .cucumber-button {
      background: #000000;
      color: var(--neon-yellow);
      border-color: var(--neon-yellow);
    }

    .cucumber-button a {
      color: inherit;
      text-decoration: none;
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Side GIF */
    .side-panel {
      width: 260px;
      max-width: 30vw;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }

    .gif-placeholder img {
      width: 100%;
      border-radius: 1rem;
    }

    /* Image slots */
    .image-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .image-slot {
      border-radius: 1rem;
      border: 3px dashed #000;
      background: rgba(255, 255, 255, 0.5);
      min-height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .image-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Sunflower strip */
    .sunflower-strip {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3rem;
      background: linear-gradient(to top, #f7d36b, #ffeaa7);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 0.3rem;
      z-index: 50;
      pointer-events: none;
    }

    .sunflower-strip span {
      font-size: 2rem;
      animation: sway 2.5s ease-in-out infinite alternate;
    }

    @keyframes sway {
      0% { transform: translateY(0) rotate(-3deg); }
      100% { transform: translateY(-2px) rotate(3deg); }
    }

    /* Flash overlay (fade in/out) */
    .flash-overlay {
      position: fixed;
      inset: 0;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: 999;
      transition: opacity 1s ease;
    }

    .flash-overlay.active {
      opacity: 1;
    }

    @media (max-width: 800px) {
      .page-wrapper {
        flex-direction: column-reverse;
      }
      .side-panel {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <!-- White flash layer -->
  <div id="flash-overlay" class="flash-overlay"></div>

  <!-- Music bar -->
  <header>
    <h1>awesome songs</h1>
    <div class="track-name" id="track-name">Track 1: song1</div>
    <div class="music-controls">
      <button class="music-button" id="play-pause-btn">Play</button>
      <button class="music-button" id="next-track-btn">Next ▶</button>
    </div>
  </header>

  <div class="page-wrapper">
    <main>
      <section class="button-grid">
        <button class="cucumber-button">
          <a href="https://en.wikipedia.org/wiki/List_of_sexually_active_popes" target="_blank" rel="noopener noreferrer">
            I have a fridge full of cucumbers by my car
          </a>
        </button>

        <button id="fart-btn">Fart 💨</button>
        <button id="click-me-btn">Click me :)</button>
        <button id="squawk-btn">Squawk 🐦</button>
      </section>

      <section class="image-row">
        <div class="image-slot">
          <img src="assets/images/rock.jpg" alt="rock">
        </div>

        <div class="image-slot">
          <img src="assets/images/flyingdog.jpg" alt="flying dog">
        </div>
      </section>
    </main>

    <aside class="side-panel">
      <div class="gif-placeholder">
        <img src="assets/images/side-gif.gif" alt="side gif">
      </div>
    </aside>
  </div>

  <div class="sunflower-strip">
    <span>🌻</span><span>🌻</span><span>🌻</span><span>🌻</span><span>🌻</span>
    <span>🌻</span><span>🌻</span><span>🌻</span><span>🌻</span><span>🌻</span>
  </div>

  <!-- Audio elements -->
  <audio id="bg-audio"></audio>
  <audio id="fart-audio"></audio>
  <audio id="click-me-audio"></audio>
  <audio id="squawk-audio"></audio>

  <script>
    /* ------------ MUSIC ------------ */
    const playlist = [
      "assets/audio/song1.mp3",
      "assets/audio/song2.mp3",
      "assets/audio/song3.mp3"
    ];

    const trackNames = ["song1", "song2", "song3"];

    const bgAudio = document.getElementById('bg-audio');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const nextTrackBtn = document.getElementById('next-track-btn');
    const trackNameDisplay = document.getElementById('track-name');

    let currentTrackIndex = 0;
    let isPlaying = false;

    function loadTrack(index) {
      currentTrackIndex = (index + playlist.length) % playlist.length;
      bgAudio.src = playlist[currentTrackIndex];
      trackNameDisplay.textContent = `Track ${currentTrackIndex + 1}: ${trackNames[currentTrackIndex]}`;
    }

    function playMusic() {
      bgAudio.play().then(() => {
        isPlaying = true;
        playPauseBtn.textContent = "Pause";
      }).catch(() => {});
    }

    function pauseMusic() {
      bgAudio.pause();
      isPlaying = false;
      playPauseBtn.textContent = "Play";
    }

    playPauseBtn.addEventListener('click', () => {
      isPlaying ? pauseMusic() : playMusic();
    });

    nextTrackBtn.addEventListener('click', () => {
      loadTrack(currentTrackIndex + 1);
      if (isPlaying) bgAudio.play().catch(() => {});
    });

    bgAudio.addEventListener('ended', () => {
      loadTrack(currentTrackIndex + 1);
      bgAudio.play().catch(() => {});
    });

    // Initialise first track
    if (playlist.length) {
      loadTrack(0);
    }

    /* --------- SOUND EFFECTS + FLASH --------- */
    const fartAudio = document.getElementById('fart-audio');
    const clickMeAudio = document.getElementById('click-me-audio');
    const squawkAudio = document.getElementById('squawk-audio');

    fartAudio.src = "assets/audio/fart.mp3";
    clickMeAudio.src = "assets/audio/click-scare.mp3";
    squawkAudio.src = "assets/audio/squawk.mp3";

    const fartBtn = document.getElementById('fart-btn');
    const clickMeBtn = document.getElementById('click-me-btn');
    const squawkBtn = document.getElementById('squawk-btn');
    const flashOverlay = document.getElementById('flash-overlay');

    function playSound(audioElement) {
      audioElement.currentTime = 0;
      audioElement.play().catch(() => {});
    }

    fartBtn.addEventListener('click', () => {
      playSound(fartAudio);
    });

    squawkBtn.addEventListener('click', () => {
      playSound(squawkAudio);
    });

    function flashScreenForSeconds(seconds) {
      flashOverlay.classList.add('active');
      setTimeout(() => {
        flashOverlay.classList.remove('active');
      }, seconds * 1000);
    }

    // Click Me: play sound immediately, then flash after 1 second
    clickMeBtn.addEventListener('click', () => {
      playSound(clickMeAudio);

      setTimeout(() => {
        flashScreenForSeconds(3); // fades in (1s), stays, then fades out when class is removed
      }, 1000);
    });
  </script>
</body>
</html>
